# EHFNet default training config
# 模型内部参数（RBF、几何、碰撞、边、预测头）在 model.toml 中配置

[data]
# 本地自定义：改成你的预处理输出目录（该目录内必须包含 index.csv，不允许自定义 index 路径）
data_root = "data/processed/hiqbind"
model_config = "configs/model.toml"
save_dir = "./checkpoints"
device = "cuda:0"
esm = "auto"

[logging]
smoke = false

[runtime]
torch_cuda_alloc_conf = "expandable_segments:True,max_split_size_mb:128"

[preprocess]
geometry_min_atom_distance = 0.5
stats_cutoff_percentile = 95.0
stats_cutoff_scale = 1.2
stats_cutoff_min = 6.0
stats_cutoff_max = 14.0

[model]
hidden_dim = 128
num_gnn_blocks = 4
esm_model_name = "esmc_300m"
esm_dim = 960
crop_radius = 10.0

[training]
epochs = 100
lr = 1e-4
weight_decay = 1e-6
clip_grad = 1.0
warmup_epochs = 20
accumulation_steps = 8
ema_decay = 0.999
val_subset_ratio = 0.3
val_full_every = 10
val_full_last_epochs = 10
ode_method = "euler"

[split]
split_train_frac = 0.7
split_val_frac = 0.1
split_test_frac = 0.2
split_seed = 42
split_cache_file = "cache/splits/hiqbind_scaffold_split.json"
force_resplit = false

[batching]
train_cost_budget = 1300000
val_cost_budget = 1300000
blind_pool_cost_budget = 1600000
final_topn_cost_budget = 1600000
eval_cost_guard_headroom = 1.5
dataloader_num_workers = 4
dataloader_pin_memory = true
dataloader_persistent_workers = true
max_oom_retry_splits = 3
enable_train_budget_callback = true
enable_val_budget_callback = true
oom_reduce_threshold = 3
oom_reduce_factor = 0.85
min_train_cost_budget = 480000
val_oom_reduce_threshold = 3
val_oom_reduce_factor = 0.85
min_val_cost_budget = 120000
train_budget_window_size = 8
train_budget_recover_window_count = 2
train_budget_recover_step = 80000
train_offender_cooldown = 6
val_budget_window_size = 4
val_budget_recover_window_count = 2
val_budget_recover_step = 80000
val_offender_cooldown = 4

[blind_inference]
test_topk = "1,5,10"
val_ode_steps = 50
center_proposal_topk = 8
center_refine_topk = 3
center_nms_radius = 6.0
stage1_pose_samples = 2
stage2_pose_samples = 4

[proposal]
center_proposal_weight = 0.15
center_positive_radius = 4.0
center_guidance_learned_start = 0.35
crop_candidate_topk = 8
crop_proposal_start = 0.10
crop_near_miss_start = 0.35
crop_hard_negative_start = 0.65
crop_min_residues = 12
crop_atom_margin = 2.0
disable_jitter_crop = false
disable_hard_negative_crop = false

[ranking]
pose_ranking_pair_weight = 0.1
pose_ranking_margin = 0.5
ranking_same_center_start = 0.55
ranking_wrong_center_start = 0.75
same_center_micro_batch_size = 2
same_center_budget_window_size = 8
same_center_budget_recover_window_count = 2
same_center_budget_recover_step = 1
same_center_offender_cooldown = 6
ranking_budget_window_size = 8
ranking_budget_recover_window_count = 2
ranking_offender_cooldown = 6
ranking_wrong_center_cap = 1

[bootstrap]
pose_bootstrap_weight = 0.05
pose_bootstrap_start = 0.80
pose_bootstrap_frequency = 25
pose_bootstrap_ode_steps = 10

[blind_pool]
# 基于 blind candidate pool 的回放式重排序与中心价值监督。
# 候选池会周期性刷新，当前模型会重新打分缓存 pose。
blind_pool_refresh_every = 3
blind_pool_start_epoch = 2
blind_pool_refresh_on_best_update = false
blind_pool_max_complexes = 500
blind_pool_cache_bce_weight = 1.0
blind_pool_cache_rank_weight = 1.0
blind_pool_pairs_per_complex = 4
replay_start_ratio = 0.85
replay_micro_batch_size = 4
replay_budget_window_size = 8
replay_budget_recover_window_count = 2
replay_candidate_cooldown = 6
replay_max_candidates_per_complex = 8

[checkpoint]
checkpoint_selection_mode = "rmsd_priority"

[ablation]
ablation_mode = "none"
run_test_after_training = true
