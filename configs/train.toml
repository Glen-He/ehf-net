# EHFNet default training config
# 模型内部参数（RBF、几何、碰撞、边、预测头）在 model.toml 中配置

[data]
# 本地自定义：改成你的预处理输出目录（该目录内必须包含 index.csv，不允许自定义 index 路径）
data_root = "data/processed/hiqbind"
model_config = "configs/model.toml"
save_dir = "./checkpoints"
device = "cuda:0"
esm = "auto"

[logging]
smoke = false

[runtime]
torch_cuda_alloc_conf = "expandable_segments:True,max_split_size_mb:128"

[preprocess]
geometry_min_atom_distance = 0.5
stats_cutoff_percentile = 95.0
stats_cutoff_scale = 1.2
stats_cutoff_min = 6.0
stats_cutoff_max = 14.0

[model]
hidden_dim = 128
num_gnn_blocks = 4
esm_model_name = "esmc_300m"
esm_dim = 960
crop_radius = 10.0

[training]
epochs = 100
lr = 1e-4
weight_decay = 1e-6
clip_grad = 1.0
warmup_epochs = 20
accumulation_steps = 8
ema_decay = 0.999
rmsd_ratio = 0.2

[split]
split_train_frac = 0.7
split_val_frac = 0.1
split_test_frac = 0.2
split_seed = 42
split_cache_file = "cache/splits/hiqbind_scaffold_split.json"
force_resplit = false

[batching]
max_nodes_per_batch = 20000
val_max_nodes_per_batch = 6000
test_max_nodes_per_batch = 5000
topn_max_nodes_per_batch = 4000
edge_budget_factor = 40
eval_edge_guard_headroom = 1.5
dataloader_num_workers = 4
dataloader_pin_memory = true
dataloader_persistent_workers = true
enable_oom_adaptive_batch = true
enable_val_oom_adaptive_batch = true
oom_reduce_threshold = 3
oom_reduce_factor = 0.85
min_max_nodes_per_batch = 12000
val_oom_reduce_threshold = 3
val_oom_reduce_factor = 0.85
min_val_max_nodes_per_batch = 3000
oom_recover_epochs = 3
oom_recover_factor = 1.1

[blind_inference]
test_topk = "1,5,10"
test_pose_samples = 10
val_ode_steps = 50
center_proposal_topk = 8
center_refine_topk = 3
center_nms_radius = 6.0
stage1_pose_samples = 2
stage2_pose_samples = 4

[proposal]
center_proposal_weight = 0.15
center_positive_radius = 4.0
crop_candidate_topk = 8
crop_min_residues = 12
crop_atom_margin = 2.0
disable_jitter_crop = false
disable_hard_negative_crop = false

[ranking]
pose_ranking_pair_weight = 0.2
pose_ranking_margin = 0.5

[bootstrap]
pose_bootstrap_weight = 0.05
pose_bootstrap_frequency = 25
pose_bootstrap_ode_steps = 10

[blind_pool]
# 基于 blind candidate pool 的回放式重排序与中心价值监督。
# 候选池会周期性刷新，当前模型会重新打分缓存 pose。
blind_pool_refresh_every = 3
blind_pool_start_epoch = 2
blind_pool_max_complexes = 500
blind_pool_cache_bce_weight = 1.0
blind_pool_cache_rank_weight = 1.0
blind_pool_pairs_per_complex = 4

[checkpoint]
checkpoint_selection_mode = "composite"

[fusion]
enable_fusion_calibration = true
fusion_search_center_weights = "0,0.15,0.25,0.35,0.5,0.65"
fusion_search_aff_weights = "0"
fusion_search_clash_weights = "0"

[ablation]
ablation_mode = "none"
run_test_after_training = true
